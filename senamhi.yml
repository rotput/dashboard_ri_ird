# Lee el pronóstico de la web del SENAMHI todos los días a las 9:00 a. m. y guarda el Excel en el repositorio.
# Render ve el cambio y vuelve a publicar el tablero con el pronóstico nuevo.
name: Pronóstico SENAMHI

on:
  schedule:
    - cron: "0 14 * * *"   # todos los días a las 9:00 a. m. hora de Lima (14:00 en hora UTC)
  workflow_dispatch:        # botón «Run workflow» para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar librerías
        run: pip install pandas openpyxl requests beautifulsoup4 lxml
      - name: Leer la web del SENAMHI
        run: python scraping_senamhi.py
      - name: Guardar el Excel en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senamhi_pronostico_nacional.xlsx
          git commit -m "Pronóstico SENAMHI $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
